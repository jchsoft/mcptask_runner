---
exclude_paths:
  - test
  - bin

detectors:
  IrresponsibleModule:
    enabled: false
  UtilityFunction:
    enabled: false
  Attribute:
    enabled: false
  ClassVariable:
    enabled: false
  BooleanParameter:
    enabled: false
  ControlParameter:
    enabled: false
  FeatureEnvy:
    enabled: false
  UncommunicativeVariableName:
    enabled: false
  InstanceVariableAssumption:
    enabled: false
  NilCheck:
    enabled: false
  RepeatedConditional:
    enabled: false
  TooManyInstanceVariables:
    max_instance_variables: 14
    exclude:
      - McptaskRunner::SnapshotBuilder
  TooManyConstants:
    max_constants: 7
    exclude:
      - McptaskRunner::Concerns::HeartbeatMonitoring # 8 named timeout/threshold constants, all meaningful
  TooManyMethods:
    max_methods: 35
  TooManyStatements:
    max_statements: 75
  LongParameterList:
    max_params: 5
  DuplicateMethodCall:
    max_calls: 5
  DataClump:
    exclude:
      - McptaskRunner::ClaudeCodeBase
      - McptaskRunner::Concerns::StreamProcessing # (name, input) on summarize_tool_input / summarize_string_input / tool_description is a deliberate tool-routing tuple, not a candidate for extraction
  ManualDispatch:
    exclude:
      - McptaskRunner::Concerns::ResultParsing#parse_result
  NestedIterators:
    max_allowed_nesting: 2
  UnusedParameters:
    enabled: false
